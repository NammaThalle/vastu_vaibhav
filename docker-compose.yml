# Local development: FastAPI with reload plus the Next.js dev server.
# Open http://localhost:3000; Next.js forwards /api/* to the api container.
services:
  api:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"]
    user: root
    volumes:
      - ./backend:/app
      - ./config:/app/config:ro
      - ./data:/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/vastu.db
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      API_PROXY_URL: http://api:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  frontend_node_modules:
