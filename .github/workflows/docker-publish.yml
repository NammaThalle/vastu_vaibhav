name: Test, build and publish

# Pull requests and pushes to main are tested. A version tag (v1.0.0) is tested and,
# if everything passes, both images are published under that version and as latest.
on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: PDF libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-core
      - run: pip install -r requirements-dev.txt
      - name: Models and migrations are in sync
        run: |
          alembic -x url=sqlite:///ci.db upgrade head
          alembic -x url=sqlite:///ci.db check
      - run: python -m pytest -q
      - name: Frontend types match the API
        run: |
          python -m app.cli.openapi /tmp/openapi.json
          diff -u ../frontend/lib/api/openapi.json /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated types match the committed schema
        run: |
          npx openapi-typescript lib/api/openapi.json -o /tmp/schema.d.ts --default-non-nullable false
          diff -u lib/api/schema.d.ts /tmp/schema.d.ts
      - run: npm run typecheck
      - run: npm run build

  publish:
    needs: [test, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: vastu_vaibhav-api
            context: backend
            target: ""
          - image: vastu_vaibhav-web
            context: frontend
            target: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Owner and version
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
